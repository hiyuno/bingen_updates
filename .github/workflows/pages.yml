name: Publish appcast to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy repo root to Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload repo root as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Requisito único de setup (no automatizable desde el workflow):
# En Settings -> Pages del repo hiyuno/bingen_updates, "Build and deployment" -> Source
# debe estar en "GitHub Actions" (no "Deploy from a branch"). Sin esto el job
# de deploy-pages falla con un error de permisos/entorno inexistente.
